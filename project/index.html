<body class="bg-[#f9f9f9] text-[#1a1a1a] font-sans antialiased min-h-screen flex flex-col">
    <!-- LOADING SCREEN -->
<div id="loading-screen" style="
    position: fixed; inset: 0; background: radial-gradient(circle, #fff5f5 0%, #ffe1e1 100%);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 9999; overflow: hidden;
    ">
 <!--Ảnh -->

<img src="../img/Mashiro.png" style="
    position: absolute; bottom: 10px; left: 60px;
    height: 45%; object-fit: contain;
    opacity: 1; z-index: 2;
    animation: slideInLeft 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
"/>


    <img src="../img/yanagi3.png" style="
        position: absolute; top: 20px; left: 30px;
        height: 45%; object-fit: contain;
        opacity: 1;
        animation: slideInLeft 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    "/>

      <img src="../img/uwu.png" style="
        position: absolute; bottom: 40px; right: 10px;
        height: 40%; object-fit: contain;
        opacity: 1;
        animation: slideInRight 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
    "/>

    <!-- Ảnh nền kéo từ trên xuống -->
    <div id="loading-bg" style="
        position: absolute; top: -100%; left: 0; right: 0;
        height: 50%; 
        
        transition: top 0.8s ease-in-out;
    "></div>

    <!-- Chữ DeathTruyen -->
   <div id="loading-title" style="
    font-size: 2.8rem; font-weight: 900;
    opacity: 0;
    z-index: 1; letter-spacing: 2px;
    ">
        <span style="color: #f2e961;">Death</span><span style="color: #8ad1fd">Truyen</span>
    </div>

    <!-- Bánh xe quay -->
    <div style="margin-top: 40px; z-index: 1;">
        <svg width="60" height="60" viewBox="0 0 40 40" style="animation: spin 1.2s linear infinite;">
            <circle cx="20" cy="20" r="18" fill="none" stroke="#d49e48" stroke-width="2"/>
            <line x1="20" y1="2" x2="20" y2="38" stroke="#d49e48" stroke-width="2"/>
            <line x1="2" y1="20" x2="38" y2="20" stroke="#d49e48" stroke-width="2"/>
            <line x1="6" y1="6" x2="34" y2="34" stroke="#d49e48" stroke-width="2"/>
            <line x1="34" y1="6" x2="6" y2="34" stroke="#d49e48" stroke-width="2"/>
            <circle cx="20" cy="20" r="3" fill="#d49e48"/>
        </svg>
    </div>
</div>

<style>


@keyframes fall {
    0%   { transform: translateY(-20px) rotate(0deg); opacity: 0.8; }
    100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
}
@keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}
@keyframes fadeInText {
    from { opacity: 0; letter-spacing: 8px; }
    to { opacity: 1; letter-spacing: 2px; }
}
@keyframes slideInLeft {
    from { transform: translateX(-150%); }
    to { transform: translateX(0); }
}
@keyframes slideInRight {
    from { transform: translateX(150%); }
    to { transform: translateX(0); }
}

</style>

<script>
window.addEventListener('load', function() {
    // Kéo ảnh nền từ trên xuống NHANH, thẳng đến cuối luôn
    setTimeout(() => {
        const bg = document.getElementById('loading-bg');
        bg.style.transition = 'top 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94)';
        bg.style.top = '0';
    }, 100);

    // Hiện chữ DeathTruyen sau 0.8s, fade từ nhạt đến đậm chậm hơn
    setTimeout(() => {
        const title = document.getElementById('loading-title');
        title.style.animation = 'fadeInText 1.2s ease forwards';
    }, 800);

    // Ẩn loading screen sau 2.5 giây
    setTimeout(() => {
        const screen = document.getElementById('loading-screen');
        screen.style.transition = 'opacity 0.5s ease';
        screen.style.opacity = '0';
        setTimeout(() => screen.style.display = 'none', 500);
    }, 2500);
});
</script>
